services:
  backend:
    build: .
    container_name: employee-management-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/emsdb?useSSL=false&allowPublicKeyRetrieval=true
      DATABASE_USERNAME: ems_user
      DATABASE_PASSWORD: ems_password
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./cms
      args:
        REACT_APP_EMPLOYEE_API_URL: http://localhost:8080/api/v1/employees
    container_name: employee-management-client
    depends_on:
      - backend
    ports:
      - "3000:80"

  mysql:
    image: mysql:8.0
    container_name: employee-management-db
    environment:
      MYSQL_DATABASE: emsdb
      MYSQL_USER: ems_user
      MYSQL_PASSWORD: ems_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uems_user", "-pems_password"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - employee_management_data:/var/lib/mysql

volumes:
  employee_management_data:
